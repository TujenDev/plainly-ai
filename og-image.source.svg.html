<style>
  html,body{margin:0;padding:0;background:#fcfcfa;}
  svg{display:block;}
</style>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
     aria-label="Plainly — AI, explained by level. Nothing to sell you.">

  <defs>
    <style>
      .serif { font-family: Georgia, "Iowan Old Style", Palatino, serif; }
      .sans  { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- paper -->
  <rect width="1200" height="630" fill="#fcfcfa"/>
  <!-- accent band, the one colour the site allows itself -->
  <rect width="1200" height="10" fill="#0b6e63"/>

  <!-- wordmark: the favicon tile, at size -->
  <rect x="80" y="62" width="78" height="78" rx="16" fill="#0b6e63"/>
  <text x="119" y="119" class="sans" font-size="54" font-weight="700"
        text-anchor="middle" fill="#fcfcfa">P</text>
  <text x="178" y="122" class="serif" font-size="58" font-weight="700" fill="#1a2029">Plainly</text>
  <text x="1120" y="118" class="sans" font-size="27" fill="#656f79" text-anchor="end">plainlyai.org</text>

  <line x1="80" y1="186" x2="1120" y2="186" stroke="#e2e4df" stroke-width="2"/>

  <!-- the site's own h1, verbatim -->
  <text x="80" y="312" class="serif" font-size="76" fill="#1a2029">AI, explained by level.</text>
  <text x="80" y="402" class="serif" font-size="76" fill="#0b6e63">Nothing to sell you.</text>

  <!-- the stamp: every field filled except the one that would rot -->
  <g transform="rotate(-2.2 285 522)">
    <rect x="80" y="466" width="410" height="112" rx="9"
          fill="#fdf3e4" stroke="#9a5b12" stroke-width="3"/>
    <text x="106" y="510" class="sans" font-size="23" font-weight="700"
          letter-spacing="4.5" fill="#9a5b12">LAST VERIFIED</text>
    <!-- blank date field: dd / mm / yyyy, deliberately unfilled -->
    <line x1="106" y1="551" x2="176" y2="551" stroke="#9a5b12" stroke-width="2.5"/>
    <text x="188" y="551" class="sans" font-size="26" fill="#9a5b12">/</text>
    <line x1="212" y1="551" x2="282" y2="551" stroke="#9a5b12" stroke-width="2.5"/>
    <text x="294" y="551" class="sans" font-size="26" fill="#9a5b12">/</text>
    <line x1="318" y1="551" x2="418" y2="551" stroke="#9a5b12" stroke-width="2.5"/>
  </g>

  <text x="1120" y="512" class="sans" font-size="29" fill="#4a5560" text-anchor="end">Every page carries the date it was checked.</text>
  <text x="1120" y="552" class="sans" font-size="29" fill="#656f79" text-anchor="end">A picture can&#8217;t, so this one doesn&#8217;t.</text>

</svg>
